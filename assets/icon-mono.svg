<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="monospace">
  <!-- 等宽 = 每个字符占同一个格。左格放宽字符（M），右格放窄字符（|），两格同宽。
